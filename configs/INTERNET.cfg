hostname INTERNET
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TO-ISP-A
 ip address 198.51.100.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO-ISP-B
 ip address 198.51.100.14 255.255.255.252
 no shutdown
!
interface Loopback0
 description SIMULATED-INTERNET-SERVICE
 ip address 192.0.2.1 255.255.255.0
!
router bgp 65000
 bgp log-neighbor-changes
 neighbor 198.51.100.9 remote-as 65001
 neighbor 198.51.100.13 remote-as 65002
 network 192.0.2.0 mask 255.255.255.0
!
end
